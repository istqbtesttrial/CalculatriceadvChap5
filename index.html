<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice avec Cartes</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="calculator">
    <div class="display" id="displayArea">
        <div id="operation" class="operation-display" role="status" aria-live="polite"></div>
        <input type="text" id="result" readonly aria-label="Résultat du calcul" aria-live="polite">
    </div>
    <div class="buttons">
        <button class="card" id="clearButton" type="button" aria-label="Effacer tout">C</button>
        <button class="card" id="deleteButton" type="button" aria-label="Supprimer le dernier caractère">DEL</button>
        <button class="card" id="percentageButton" type="button" aria-label="Pourcentage de l'expression">%</button>
        <button class="card" id="sqrtButton" type="button" aria-label="Racine carrée">√</button>

        <button class="card light number" data-value="7" type="button" aria-label="Sept">7</button>
        <button class="card light number" data-value="8" type="button" aria-label="Huit">8</button>
        <button class="card light number" data-value="9" type="button" aria-label="Neuf">9</button>
        <button class="card operator" data-operator="/" type="button" aria-label="Division">/</button>

        <button class="card light number" data-value="4" type="button" aria-label="Quatre">4</button>
        <button class="card light number" data-value="5" type="button" aria-label="Cinq">5</button>
        <button class="card light number" data-value="6" type="button" aria-label="Six">6</button>
        <button class="card operator" data-operator="*" type="button" aria-label="Multiplication">×</button>

        <button class="card light number" data-value="1" type="button" aria-label="Un">1</button>
        <button class="card light number" data-value="2" type="button" aria-label="Deux">2</button>
        <button class="card light number" data-value="3" type="button" aria-label="Trois">3</button>
        <button class="card operator" data-operator="-" type="button" aria-label="Soustraction">-</button>

        <button class="card light number" data-value="0" type="button" aria-label="Zéro">0</button>
        <button class="card light number" data-value="." type="button" aria-label="Point">.</button>
        <button class="card operator" data-operator="^" id="powerButton" type="button" aria-label="Puissance">x&#x02B8;</button>

        <button class="card operator" data-operator="+" type="button" aria-label="Addition">+</button>

        <button class="card" id="equalsButton" type="button" style="grid-column: span 4;" aria-label="Calculer">=</button>
    </div>
    <div id="history" class="history"></div>
</div>
<script src="script.js"></script>
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js').catch(console.error);
}
</script>
</body>
</html>
